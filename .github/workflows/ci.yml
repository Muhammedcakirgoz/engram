name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS so the iOS targets are compiled too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (JVM)
        run: ./gradlew :engram-core:jvmTest :engram-compose:jvmTest
      - name: Compile all targets
        run: >
          ./gradlew
          :engram-core:compileKotlinIosArm64 :engram-compose:compileKotlinIosArm64
          :engram-core:compileAndroidMain :engram-compose:compileAndroidMain
          :engram-core:compileKotlinWasmJs :engram-compose:compileKotlinWasmJs
          :engram-core:compileKotlinJs :engram-compose:compileKotlinJs
          :sample:compileKotlinJvm
